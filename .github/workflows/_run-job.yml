# Shared by the scheduled job workflows: runs one job from scripts/jobs with the
# service-role key from GitHub Secrets. A failed job exits non-zero, so GitHub emails the owner.
name: Run a job

on:
  workflow_call:
    inputs:
      job:
        description: Module in scripts/jobs to run, e.g. fetch_nav
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m jobs.${{ inputs.job }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
