name: Backup

# Weekly: every owner table as JSON, encrypted with age (public key in BACKUP_AGE_RECIPIENT),
# uploaded as a workflow artifact kept 90 days. The plaintext never touches disk.
# Restore: docs/RUNBOOK.md. Sundays 08:41 IST (timezone key; odd minute avoids the busy hour start).
on:
  schedule:
    - cron: '41 8 * * 0'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: python -m jobs.backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DIR: backup-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backup-${{ github.run_id }}
          path: scripts/backup-out/*.age
          retention-days: 90
          if-no-files-found: error
