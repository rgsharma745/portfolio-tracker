name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:worker
      - run: npm run build
      - name: Service role key must not reach the bundle
        run: node scripts/check-bundle-secrets.mjs dist

  integration:
    # Applies supabase/migrations to a throwaway local stack, then runs the RLS/upsert and
    # job tests and the Playwright suite (real magic-link sign-in via the local Mailpit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - name: Start local Supabase
        run: npx -y supabase@3.0.0 start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio
      - run: pip install -r scripts/requirements-dev.txt
      - name: Install age (backup encryption test)
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: pytest
        working-directory: scripts
      - name: db.types.ts matches the migrations
        working-directory: web
        run: |
          npm ci
          npm run gen:types
          git diff --exit-code src/app/core/db.types.ts
      # Browsers are cached per exact Playwright version (from package-lock), so a Renovate
      # bump fetches new ones. The system libraries come from apt and are installed each run.
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium webkit
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
