name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:worker
      - run: npm run build
      - name: Service role key must not reach the bundle
        run: node scripts/check-bundle-secrets.mjs dist

  integration:
    # Applies supabase/migrations to a throwaway local stack, then runs the RLS/upsert and
    # job tests, the SonarQube scan (it needs the pytest coverage, and pytest needs the stack)
    # and the Playwright suite (real magic-link sign-in via the local Mailpit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarQube uses the history to tell new code from old
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - name: Install Supabase CLI
        env:
          SUPABASE_CLI_VERSION: 3.2.0
        run: |
          release_url="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          archive_name="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          checksums="$RUNNER_TEMP/supabase-checksums.txt"
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$checksums" "$release_url/checksums.txt"
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$archive" "$release_url/$archive_name"
          checksum="$(awk -v asset="$archive_name" '$2 == asset { print $1 }' "$checksums")"
          if [[ ! "$checksum" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Missing or invalid SHA-256 for $archive_name" >&2
            exit 1
          fi
          echo "$checksum  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/supabase" /usr/local/bin/supabase
          supabase --version
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio
      - run: 'pip install --require-hashes --only-binary=:all: -r scripts/requirements-dev.txt'
      # The release binary from GitHub (a second or two), not apt: `apt-get update` alone took
      # 25-40 s. Pinned by version and checksum; bump both together.
      - name: Install age (backup encryption test)
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$RUNNER_TEMP/age.tgz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
          age --version
      - run: pytest --cov --cov-report=xml
        working-directory: scripts
      - name: db.types.ts matches the migrations
        working-directory: web
        run: |
          npm ci --ignore-scripts
          supabase gen types typescript --local --schema public > src/app/core/db.types.ts
          ./node_modules/.bin/prettier --write src/app/core/db.types.ts
          git diff --exit-code src/app/core/db.types.ts
      # SonarQube Cloud, report only: results go to the PR and the dashboard, a failing quality
      # gate does not fail CI, and the scan is skipped until the SONAR_TOKEN secret exists.
      # Coverage comes from pytest (above), the unit tests and the Playwright run (below).
      - name: SonarQube enabled
        id: sonar
        run: |
          echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Unit test coverage for SonarQube
        if: steps.sonar.outputs.enabled == 'true'
        working-directory: web
        run: npm run test:sonar
      # Browsers are cached per exact Playwright version (from package-lock), so a Renovate
      # bump fetches new ones. The system libraries are apt packages and must be installed on
      # every run, but their downloads (about 140 MB, 6+ minutes from Ubuntu's mirror) are
      # cached: apt then only unpacks them (about 30 s). A new runner image or Playwright
      # version starts from the previous cache and downloads only what changed.
      - name: Playwright version
        id: playwright
        working-directory: web
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Cache Playwright system library downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-debs
          key: playwright-debs-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-debs-
      # A slow Ubuntu mirror once made an installation take 30 minutes: fail fast instead, and
      # re-run the job.
      - name: Install Playwright system libraries
        working-directory: web
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          rm -f ~/apt-debs/*.deb # saved again below: only what this install used
          # Keep what apt downloads (some images delete it after each install).
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          ./node_modules/.bin/playwright install-deps chromium webkit
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-debs/ {} +
          echo "Cached $(ls ~/apt-debs | wc -l) packages"
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install chromium webkit
      - name: Playwright
        working-directory: web
        env:
          # Chromium records which app code the tests run, for SonarQube (e2e/support/coverage.ts).
          E2E_COVERAGE: ${{ steps.sonar.outputs.enabled == 'true' && '1' || '' }}
        run: npm run e2e
      # Run even if a Playwright test failed, so the dashboard stays current; a failed E2E run
      # can leave out its coverage, which only lowers the reported number. Both lcov files name
      # sources from web/ (src/app/…), Sonar from the repo root (web/src/app/…).
      - name: Coverage paths for SonarQube
        if: ${{ !cancelled() && steps.sonar.outputs.enabled == 'true' }}
        working-directory: web
        run: sed -i 's#^SF:src/#SF:web/src/#' coverage/portfolio-tracker/lcov.info coverage/e2e/lcov.info
      # The scanner's Java runtime and analyzer plugins (about 15 s to download). Sonar
      # updates its plugins often: a new cache each week, starting from the last one; the
      # scanner checks each file and downloads only what changed. Sonar caches the analysis
      # itself on its side, so unchanged files are not re-analysed.
      - name: Cache SonarQube scanner downloads
        if: ${{ !cancelled() && steps.sonar.outputs.enabled == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ steps.sonar.outputs.week }}
          restore-keys: sonar-${{ runner.os }}-
      - name: SonarQube
        if: ${{ !cancelled() && steps.sonar.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
