name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:worker
      - run: npm run build
      - name: Service role key must not reach the bundle
        run: node scripts/check-bundle-secrets.mjs dist

  integration:
    # Applies supabase/migrations to a throwaway local stack, then runs the RLS/upsert and
    # job tests, the SonarQube scan (it needs the pytest coverage, and pytest needs the stack)
    # and the Playwright suite (real magic-link sign-in via the local Mailpit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarQube uses the history to tell new code from old
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - name: Start local Supabase
        run: npx -y supabase@3.0.0 start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio
      - run: pip install -r scripts/requirements-dev.txt
      - name: Install age (backup encryption test)
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: pytest --cov --cov-report=xml
        working-directory: scripts
      - name: db.types.ts matches the migrations
        working-directory: web
        run: |
          npm ci
          npm run gen:types
          git diff --exit-code src/app/core/db.types.ts
      # SonarQube Cloud, report only: results go to the PR and the dashboard, a failing quality
      # gate does not fail CI, and the scan is skipped until the SONAR_TOKEN secret exists.
      - name: SonarQube enabled
        id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Unit test coverage for SonarQube
        if: steps.sonar.outputs.enabled == 'true'
        working-directory: web
        run: |
          npm run test:sonar
          sed -i 's#^SF:src/#SF:web/src/#' coverage/portfolio-tracker/lcov.info
      - name: SonarQube
        if: steps.sonar.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Browsers are cached per exact Playwright version (from package-lock), so a Renovate
      # bump fetches new ones. The system libraries come from apt and are installed each run.
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # Normally 2-3 minutes (under 1 with cached browsers). A slow Ubuntu mirror once made
      # this 30 minutes: fail fast instead, and re-run the job.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
