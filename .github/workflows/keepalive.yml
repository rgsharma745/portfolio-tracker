name: Keep-alive

# A trivial weekly query so the free Supabase project never pauses, even if other jobs stop.
# Wednesdays 11:19 IST (timezone key; odd minute avoids GitHub's busy hour start).
on:
  schedule:
    - cron: '19 11 * * 3'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: keepalive
    secrets: inherit
