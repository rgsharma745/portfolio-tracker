name: NAV

# Mutual fund NAVs from AMFI, for the scheme codes held only.
# 23:37 IST, and a retry at 08:17 IST (before the 08:37 snapshot). Times are IST (timezone key).
# Odd minutes on purpose: GitHub delays, and sometimes drops, runs at the busy start of the hour.
on:
  schedule:
    - cron: '37 23 * * *'
      timezone: Asia/Kolkata
    - cron: '17 8 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-fetch-nav

jobs:
  fetch-nav:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: fetch_nav
    secrets: inherit
