name: NAV

# Mutual fund NAVs from AMFI, for the scheme codes held only.
# 23:30 IST, and a retry at 07:00 IST (GitHub cron is UTC).
on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-fetch-nav

jobs:
  fetch-nav:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: fetch_nav
    secrets: inherit
