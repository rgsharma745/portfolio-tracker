name: NAV

# Mutual fund NAVs from AMFI and NPS NAVs from NPS Trust (Protean CRA as fallback), for the
# Scheme codes held only. Two independent jobs: one failing does not stop the other.
# 23:37 IST, and a retry at 08:17 IST (before the 08:37 snapshot). Times are IST (timezone key).
# Odd minutes on purpose: GitHub delays, and sometimes drops, runs at the busy start of the hour.
# Run now in Settings dispatches this workflow, so it refreshes both.
# On time: a Cloudflare Cron Trigger dispatches it at both times (web/worker/schedule.ts);
# GitHub's own schedule below often starts hours late and stays only as a fallback.
# The snapshot runs after the morning run (snapshot.yml).
on:
  schedule:
    - cron: '37 23 * * *'
      timezone: Asia/Kolkata
    - cron: '17 8 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-fetch-nav

jobs:
  fetch-nav:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: fetch_nav
    secrets: inherit

  fetch-nps-nav:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: fetch_nps_nav
    secrets: inherit
