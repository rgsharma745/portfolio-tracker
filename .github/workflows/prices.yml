name: Prices

# Stock prices (NSE bhavcopy, Yahoo) and USD/INR (Frankfurter), for the symbols held only.
# 19:13 IST Mon–Fri (after NSE publishes the day's bhavcopy) and 04:23 IST Tue–Sat (after the
# US close of Mon–Fri). Times are IST (timezone key); odd minutes avoid GitHub's busy hour start.
# On time: a Cloudflare Cron Trigger dispatches it at both times (web/worker/schedule.ts);
# GitHub's own schedule often starts hours late and stays only as a fallback.
on:
  schedule:
    - cron: '13 19 * * 1-5'
      timezone: Asia/Kolkata
    - cron: '23 4 * * 2-6'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-fetch-prices

jobs:
  fetch-prices:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: fetch_prices
    secrets: inherit
