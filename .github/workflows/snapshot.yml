name: Snapshot

# One portfolio_snapshots row per active portfolio for the day, after the night's NAV and
# price runs: 08:37 IST (timezone key; odd minute avoids GitHub's busy hour start).
on:
  schedule:
    - cron: '37 8 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-snapshot

jobs:
  snapshot:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: snapshot
    secrets: inherit
