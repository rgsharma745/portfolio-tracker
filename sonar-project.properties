# SonarQube Cloud (Free plan: private code up to 50k lines, main branch and PRs into main).
# Analysed from CI (.github/workflows/ci.yml › integration › SonarQube), not by Sonar's
# automatic analysis, so the scan gets coverage. Report only: a failing quality gate shows
# on the PR and the dashboard but does not fail CI. See docs/RUNBOOK.md › SonarQube.
sonar.organization=rgsharma745
sonar.projectKey=rgsharma745_portfolio-tracker
sonar.projectName=portfolio-tracker

# Code: the Angular app, the Cloudflare Worker, the web build scripts and the Python jobs.
sonar.sources=web/src,web/worker,web/scripts,scripts/jobs,scripts/lib,scripts/tools
sonar.tests=web/src,web/worker,web/e2e,scripts/tests
sonar.test.inclusions=**/*.spec.ts,web/e2e/**,scripts/tests/**
# Generated: database types (npm run gen:types) and env.ts (scripts/set-env.mjs).
sonar.exclusions=**/*.spec.ts,web/src/app/core/db.types.ts,web/src/environments/env*.ts

# Coverage from the same CI job: Vitest lcov (npm run test:sonar; paths rewritten from
# src/… to web/src/…) and pytest-cov (scripts/pyproject.toml › tool.coverage).
sonar.javascript.lcov.reportPaths=web/coverage/portfolio-tracker/lcov.info
sonar.python.coverage.reportPaths=scripts/coverage.xml
# Not unit-tested on purpose: the Worker is tested by its own Vitest run without coverage,
# and the web scripts are build and local-dev tooling.
sonar.coverage.exclusions=web/worker/**,web/scripts/**
sonar.python.version=3.15
