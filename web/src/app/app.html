<!-- Placeholder shell; the responsive sidebar / bottom-nav shell arrives in Phase 4. -->
<div class="app-page">
  <header class="flex items-center justify-between gap-4 py-4">
    <h1 class="app-title">Portfolio Tracker</h1>
    <button
      pButton
      type="button"
      iconOnly
      rounded
      severity="secondary"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
    </button>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
